<main class="auth-shell">
  <section class="auth-card" aria-label="Formulario de inicio de sesión">
    <div class="auth-header">
      <span class="brand">Austral</span>
      <h1>Iniciar sesión</h1>
      <p>Ingresá tu correo y contraseña.</p>
    </div>

    <form class="auth-form" (submit)="onsubmit($event)" #loginForm="ngForm">
      <div class="field-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" placeholder="juan@austral.edu.ar" [formField]="formLogin.email" email autocomplete="email" />
      </div>

      <div class="field-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Tu contraseña" [formField]="formLogin.password" autocomplete="current-password" />
      </div>

      <button type="submit" [disabled]="loginForm.invalid">Entrar</button>
    </form>

    <p class="switch-copy">¿No tenés cuenta? <a routerLink="/register">Crear cuenta</a></p>
  </section>
</main>
